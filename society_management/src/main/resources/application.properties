# Server port
server.port=8080

# Database configurations (in-memory H2)
spring.datasource.url=jdbc:h2:mem:societydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate automatic schema creation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Allow H2 console frame to load in static index
spring.headers.frameOptions.value=SAMEORIGIN
